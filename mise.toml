[settings]
lockfile = true
lockfile_mode = "generate"
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]
locked = true
minimum_release_age = "7d"

[tools]
hk = { version = "2.4.0", postinstall = "hk install --mise" }
betterleaks = "1.9.0"
cocogitto = "7.0.0"
go = "1.27.2"
actionlint = "1.7.12"
zizmor = "1.30.1"
golangci-lint = "2.14.0"
goreleaser = "2.18.2"

[shell_alias]
"dots:local" = "go run ."
"dots:it" = "DOTS_CONFIG=\"${XDG_CONFIG_HOME:-$HOME/.config}/dots/integration-test/config.toml\" go run ."

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks."integration:test"]
description = "Run integration tests"
run = "go test -v -count=1 -tags=integration ./integration"

[tasks.lint]
description = "Run centrally managed hk checks"
run = "hk check --all --check"

[tasks.build]
description = "Build dots"
run = "go build -o ./dist/dots ."

[tasks.check]
description = "Run all non-writing project checks"
run = [
  "go mod verify",
  "go test -race -mod=readonly ./...",
  "go test -count=1 -tags=integration ./integration",
  "go build ./...",
  "hk check --all --check",
  "goreleaser check",
]
