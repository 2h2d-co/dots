name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: go-release
  cancel-in-progress: false

permissions: {}

env:
  MISE_LOCKED: "1"

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: macos-15
    permissions:
      attestations: write # Required for actions/attest to create artifact attestations.
      contents: write # Required for GoReleaser to create GitHub releases and upload release assets.
      id-token: write # Required for actions/attest Sigstore signing.
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.14
          install: true
          install_args: --locked go goreleaser
          cache: false

      - name: Validate release tag
        shell: bash
        run: |
          if [[ $(git cat-file -t "refs/tags/$GITHUB_REF_NAME") != commit ]]; then
            echo "release tag $GITHUB_REF_NAME must be a lightweight tag" >&2
            exit 1
          fi

      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
